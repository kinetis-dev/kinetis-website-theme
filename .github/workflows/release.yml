name: Release

# A maintainer pushes a vX.Y.Z tag on main; this publishes the wheel and
# sdist as a GitHub release, then proves the pinned URL installs. An asset
# is never re-uploaded for an existing tag: consumers pin the URL, so a
# changed file under it would silently alter their builds.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v7
      - name: Tag must equal the pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match pyproject version {version} (expected v{version})")
          print(f"tag {tag} matches pyproject version {version}")
          EOF
      - name: Build the wheel and sdist
        run: |
          pip install -q build
          python -m build --wheel --sdist
      - name: Install the wheel with both extras, plus the sample site's extensions
        run: |
          wheel="$(ls dist/*.whl)"
          pip install -q "${wheel}[blog,notfound]" -r tests/sample-site/requirements.txt
      - name: Build the sample site
        run: sphinx-build -W --keep-going -b html tests/sample-site _build
      - name: URL-baseline guard
        run: python tools/check_url_baseline.py check _build
      - name: Unit and assertion tests
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create the release (fails if one already exists for this tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; assets are never re-uploaded for an existing tag" >&2
            exit 1
          fi
          gh release create "$TAG" dist/*.whl dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes

  post-release:
    needs: release
    runs-on: ubuntu-latest
    # Clean image, no checkout and no git: the install must work exactly as a
    # consumer's requirements.txt pin does.
    container: python:3.12-slim
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: git is absent
        run: |
          if command -v git; then echo "git is installed; this check must run without it" >&2; exit 1; fi
      - name: Install from the release URL and import
        run: |
          VERSION="${TAG#v}"
          pip install "kinetis-website-theme @ https://github.com/kinetis-dev/kinetis-website-theme/releases/download/$TAG/kinetis_website_theme-${VERSION}-py3-none-any.whl"
          python -c "import kinetis_website_theme; print(kinetis_website_theme.__version__)"
