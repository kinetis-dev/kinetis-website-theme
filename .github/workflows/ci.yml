name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  test:
    needs: wheel
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Install the wheel with both extras, plus the sample site's extensions
        run: |
          wheel="$(ls dist/*.whl)"
          pip install -q "${wheel}[blog,notfound]" -r tests/sample-site/requirements.txt
      - name: Build the sample site
        run: sphinx-build -W --keep-going -b html tests/sample-site _build
      - name: URL-baseline guard
        run: python tools/check_url_baseline.py check _build
      - name: Unit and assertion tests
        run: python -m unittest discover -s tests -v

  goldens:
    needs: wheel
    runs-on: ubuntu-latest
    # Goldens are only valid in this image; see tests/goldens/README.md.
    container: mcr.microsoft.com/playwright/python:v1.64.1-noble
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Install the wheel, the sample site's extensions, Playwright and Pillow
        run: |
          wheel="$(ls dist/*.whl)"
          python3 -m pip install -q "$wheel" -r tests/sample-site/requirements.txt playwright==1.64.1 pillow
      - name: Build the sample site
        run: sphinx-build -W --keep-going -b html tests/sample-site _build
      - name: Compare light/dark screenshots with the goldens
        run: python3 tests/goldens/goldens.py check _build --out goldens-output
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: goldens-output
          path: goldens-output/
